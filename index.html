<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M9 13h6 M9 17h4"/></svg>
      </div>
      <span class="brand-name">Contract Review</span>
    </div>

    <div id="file-pill" class="file-pill" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5"/></svg>
      <span id="file-name" class="file-name"></span>
      <span id="file-size" class="file-size"></span>
    </div>

    <div class="header-spacer"></div>

    <button id="upload-btn" type="button" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 16V4 M7 9l5-5 5 5 M5 20h14"/></svg>
      <span id="upload-btn-label">Upload contract</span>
    </button>
    <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>
  </header>

  <main class="layout">
    <!-- Left: contract -->
    <section class="panel contract-panel" aria-label="Contract">
      <div class="panel-header">
        <h2 class="panel-title">Contract</h2>
        <span id="status-badge" class="badge badge-muted">No file</span>
      </div>

      <div class="contract-body">
        <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
             aria-label="Upload a PDF contract">
          <div class="drop-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5 M12 18v-6 M9 15l3-3 3 3"/></svg>
          </div>
          <p class="drop-title">Drop your PDF contract here</p>
          <p class="drop-sub">or <span class="link">browse your files</span></p>
          <p class="drop-hint">PDF files only</p>
          <p id="drop-error" class="drop-error" role="alert"></p>
        </div>
        <iframe id="pdf-viewer" class="pdf-viewer" title="Contract preview" hidden></iframe>
      </div>
    </section>

    <!-- Right: chat -->
    <section class="panel chat-panel" aria-label="Chat">
      <div class="panel-header">
        <span class="status-dot" aria-hidden="true"></span>
        <h2 class="panel-title">Ask about this contract</h2>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="message assistant">
          <div class="avatar" aria-hidden="true">CR</div>
          <div class="bubble">Hi! Upload a contract, then ask me anything about it.</div>
        </div>
      </div>

      <div class="suggestions">
        <span class="suggestions-label">Suggested questions</span>
        <div class="chips">
          <button type="button" class="chip">Summarize key obligations</button>
          <button type="button" class="chip">Any auto-renewal terms?</button>
          <button type="button" class="chip">How can we terminate?</button>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <label for="chat-input" class="visually-hidden">Your question</label>
        <div class="composer">
          <textarea id="chat-input" rows="1" placeholder="Ask about this contract…"></textarea>
          <button type="submit" class="btn btn-primary">
            Send
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
